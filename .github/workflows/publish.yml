name: Publish due words

on:
  schedule:
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: word-garden-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Publish the next due entries
        run: python scripts/publish_due.py
      - name: Validate changed state
        run: python -m unittest discover -s tests -v
      - name: Commit and push publication state
        id: commit
        run: |
          if git diff --quiet -- content/state.json; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "word-garden-bot"
          git config user.email "word-garden-bot@users.noreply.github.com"
          git add content/state.json
          git commit -m "Publish words for $(TZ=Australia/Sydney date +%F)"
          git push origin main
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      - name: Dispatch deployment for bot-authored push
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
